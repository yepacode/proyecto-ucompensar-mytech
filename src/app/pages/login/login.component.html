<div class="login">
  <div class="login__contenedor">
    <div class="login__header">
      <h1 class="login__logo">MyTech<span class="login__logo-punto">.</span></h1>
      <p class="login__subtitulo">Panel de Administracion</p>
    </div>

    <form class="login__formulario" (ngSubmit)="login()">
      <div class="login__campo">
        <label class="login__label" for="email">Email</label>
        <input
          class="login__input"
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="admin@mytech.com"
          required
        />
      </div>

      <div class="login__campo">
        <label class="login__label" for="password">Contraseña</label>
        <input
          class="login__input"
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="login__error" *ngIf="error">
        {{ error }}
      </div>

      <button class="login__boton" type="submit" [disabled]="cargando || !email || !password">
        {{ cargando ? 'Ingresando...' : 'Iniciar Sesion' }}
      </button>
    </form>
  </div>
</div>
