<div class="crud">
  <div class="crud__header">
    <h2 class="crud__titulo">Proyectos <span>({{ proyectos.length }})</span></h2>
    <button class="crud__btn-crear" (click)="abrirCrear()">+ Crear Proyecto</button>
  </div>

  <div class="crud__mensaje" [ngClass]="{'crud__mensaje--exito': tipoMensaje==='exito', 'crud__mensaje--error': tipoMensaje==='error'}" *ngIf="mensaje">{{ mensaje }}</div>

  <div class="crud__tabla-wrapper">
    <table class="crud__tabla">
      <thead>
        <tr>
          <th>ID</th>
          <th>Titulo</th>
          <th>Categoria</th>
          <th>Estado</th>
          <th>Orden</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of proyectos">
          <td>{{ item.id }}</td>
          <td>{{ item.titulo }}</td>
          <td>{{ item.categoria || '-' }}</td>
          <td><span class="crud__badge" [ngClass]="item.activo ? 'crud__badge--activo' : 'crud__badge--inactivo'">{{ item.activo ? 'Activo' : 'Inactivo' }}</span></td>
          <td>{{ item.orden }}</td>
          <td>
            <div class="crud__acciones">
              <button class="crud__btn-editar" (click)="abrirEditar(item)">Editar</button>
              <button class="crud__btn-eliminar" (click)="eliminar(item)">Eliminar</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="crud__vacio" *ngIf="proyectos.length === 0">No hay proyectos registrados</div>
  </div>

  <!-- Modal -->
  <div class="crud__modal" *ngIf="mostrarModal">
    <div class="crud__modal-overlay" (click)="mostrarModal = false"></div>
    <div class="crud__modal-contenido">
      <div class="crud__modal-header">
        <h3 class="crud__modal-titulo">{{ editando ? 'Editar' : 'Crear' }} Proyecto</h3>
        <button class="crud__modal-cerrar" (click)="mostrarModal = false">&times;</button>
      </div>
      <form class="crud__form" (ngSubmit)="guardar()">
        <div class="crud__campo">
          <label class="crud__label">Titulo</label>
          <input class="crud__input" [(ngModel)]="form.titulo" name="titulo" required placeholder="Nombre del proyecto">
        </div>
        <div class="crud__campo">
          <label class="crud__label">Descripcion</label>
          <textarea class="crud__textarea" [(ngModel)]="form.descripcion" name="descripcion" placeholder="Descripcion del proyecto"></textarea>
        </div>
        <div class="crud__campo">
          <label class="crud__label">Categoria</label>
          <select class="crud__select" [(ngModel)]="form.categoria_id" name="categoria_id">
            <option [ngValue]="null">-- Seleccionar --</option>
            <option *ngFor="let cat of categorias" [ngValue]="cat.id">{{ cat.nombre }}</option>
          </select>
        </div>
        <div class="crud__campo">
          <label class="crud__label">Categoria (texto)</label>
          <input class="crud__input" [(ngModel)]="form.categoria" name="categoria" placeholder="E-commerce, Sistema Web, etc.">
        </div>
        <div class="crud__campo">
          <label class="crud__label">Tecnologias (una por linea)</label>
          <textarea class="crud__textarea" [(ngModel)]="tecnologiasTexto" name="tecnologias" placeholder="Angular&#10;Laravel&#10;MySQL"></textarea>
        </div>
        <div class="crud__campo">
          <label class="crud__label">Icono (emoji)</label>
          <input class="crud__input" [(ngModel)]="form.icono" name="icono" placeholder="🛒">
        </div>
        <div class="crud__campo">
          <label class="crud__label">Imagen (URL)</label>
          <input class="crud__input" [(ngModel)]="form.imagen" name="imagen" placeholder="https://...">
        </div>
        <div class="crud__campo">
          <label class="crud__label">Color de fondo</label>
          <input class="crud__input" type="color" [(ngModel)]="form.color_fondo" name="color_fondo">
        </div>
        <div class="crud__campo">
          <label class="crud__label">Orden</label>
          <input class="crud__input" type="number" [(ngModel)]="form.orden" name="orden">
        </div>
        <div class="crud__campo">
          <label class="crud__label">
            <input type="checkbox" [(ngModel)]="form.activo" name="activo"> Activo
          </label>
        </div>
        <div class="crud__form-acciones">
          <button type="button" class="crud__btn-cancelar" (click)="mostrarModal = false">Cancelar</button>
          <button type="submit" class="crud__btn-guardar" [disabled]="cargando">{{ cargando ? 'Guardando...' : 'Guardar' }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
